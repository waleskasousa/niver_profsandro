<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Feliz Aniversário, Sandro! 🎉</title>
  <style>
    body {
      background: #ffe2d1;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }

    h1 {
      font-size: 48px;
      color: #e60039;
    }

    h2 {
      font-size: 32px;
      color: #444;
    }

    p {
      font-size: 22px;
      color: #222;
      margin-top: 20px;
    }

    img {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 0 10px #e60039;
      margin-top: 20px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <h1>🎂 Feliz Aniversário!</h1>
  <h2>Parabéns, Sandro! 🥳</h2>

  <img src="./foto.jpg" alt="Foto do Sandro">

  <p>Que o seu dia seja incrível, cheio de alegria, saúde e boas energias! 🎉🎁</p>

  <audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
  Seu navegador não suporta áudio :(
</audio>

<button onclick="document.getElementById('musica').play()">🔊 Tocar música</button>
</body>
</html>
